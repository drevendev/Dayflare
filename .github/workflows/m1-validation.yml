# Offline M1 source acceptance; no Wikimedia calls or deployment.
name: M1 identity and visitor acceptance
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visitor:
    name: M1 synthetic visitor and source contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic synthetic projection
        run: python -m tools.m1_build_preview --check
      - name: Verify immutable identity-history comparison
        run: python -m unittest discover -s tests -p 'test_m1_identity_history.py' -v
      - name: Verify later-day stable-ID acquisition (offline only)
        run: python -m unittest discover -s tests -p 'test_m1_identity_followup.py' -v
      - name: Check read-only, manual real-source workflow contract
        run: python -m unittest discover -s tests -p 'test_m1_followup_workflow.py' -v
      - name: Build labelled synthetic identity-history example
        run: |
          mkdir -p artifacts
          python -m tools.m1_identity_history_demo artifacts/m1-identity-history
      - name: Retain synthetic identity-history report (not real observations)
        uses: actions/upload-artifact@v4
        with:
          name: m1-identity-history-synthetic-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/m1-identity-history/
          if-no-files-found: error
          retention-days: 7
      - name: Verify and build retained real identity baseline (no collection)
        run: |
          python -m unittest discover -s tests -p 'test_m1_retained_identity.py' -v
          python -m tools.m1_retained_identity artifacts/m1-retained-identity
          python -m tools.m1_retained_identity --check artifacts/m1-retained-identity
      - name: Reproduce real Nov 4–5 identity evidence (no network)
        run: |
          python -m unittest discover -s tests -p 'test_m1_real_pair.py' -v
          python -m tools.m1_real_pair artifacts/m1-real-identity-history
          python -m tools.m1_real_pair --zip artifacts/m1-real-identity-history.zip
      - name: Verify portable source capsules and build labelled synthetic example
        run: |
          python -m unittest discover -s tests -p 'test_m1_identity_capsule.py' -v
          python -m tools.m1_identity_capsule_demo artifacts/m1-identity-capsule-synthetic
      - name: Round-trip accepted real source bytes through portable capsule (no acquisition)
        run: python tests/m1/check_identity_capsule_real.py artifacts/m1-retained-identity/source artifacts/m1-identity-capsule-real
      - name: Exercise JavaScript state and bounded transport
        run: |
          node tests/js_m1_share.cjs
          node tests/js_identity_explorer.cjs
          node tests/js_curated_explorer.cjs
      - name: Install pinned Playwright Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Normal local HTTP browser journey, not a public deployment
        run: python tests/m1/browser_preview.py
      - name: Verify rolling-source atlas with local HTTP Chromium (synthetic fixture)
        run: python tests/m1/browser_rolling_snapshot_preview.py
      - name: Verify retained Nov 18 real-source atlas in local HTTP Chromium
        run: python tests/m1/browser_20261121_retained.py
      - name: Retain real-source Nov 18 mobile/desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-20-retained-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/m1-20-real-browser/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Rebuild retained Nov 21 30-title atlas from Git (no source requests)
        run: |
          python -m tools.m1_30_source_capsule replay \
            evidence/m1-30-20261124-source.xz.b64 artifacts/m1-30-20261121-local \
            --original-sha256 1721869d687dd5f1b08b9ba9dcd963f8477299151f7f1c5f24090222c14fc305 \
            --capsule-sha256 10d7fa4ed4b7c2bdab98d3c7d4c64a70d12b27aa15df5d4fd67f16194b93c543 \
            > artifacts/m1-30-20261121-replay.json
      - name: Verify real Nov 21 atlas and exact visitor download over HTTP
        run: python tests/m1/browser_30_source_artifact.py artifacts/m1-30-20261121-local artifacts/m1-30-20261121-browser
      - name: Retain browser-checked Nov 21 30-title HTML (not deployed)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m1-30-20261121-local-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/m1-30-20261121-local/
            artifacts/m1-30-20261121-replay.json
            artifacts/m1-30-20261121-browser/
          if-no-files-found: error
          retention-days: 14
      - name: Verify identity-history evidence with local HTTP Chromium (synthetic fixture)
        run: python tests/m1/browser_identity_history.py
      - name: Verify retained real identity baseline with local HTTP Chromium
        run: python tests/m1/browser_retained_identity.py
      - name: Verify actual two-date history with local HTTP Chromium
        run: python tests/m1/browser_real_pair.py
      - name: Verify portable capsules with native HTTP Chromium
        run: |
          python tests/m1/browser_identity_capsule.py
          python tests/m1/browser_identity_capsule.py --real-source artifacts/m1-retained-identity/source
      - name: Retain portable capsules with separate evidence labels
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m1-portable-capsules-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/m1-identity-capsule-synthetic/
            artifacts/m1-identity-capsule-real/
          if-no-files-found: error
          retention-days: 7
      - name: Retain real and synthetic capsule screenshots for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-capsule-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/local-capsule-synthetic-browser/*.png
            evidence/local-capsule-real-browser/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Retain verified two-date HTML/JSON (not a deployment)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m1-real-pair-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/m1-real-identity-history/
            artifacts/m1-real-identity-history.zip
          if-no-files-found: error
          retention-days: 7
      - name: Retain real two-date Chromium screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-real-pair-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/local-m1-real-pair-browser/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Retain real baseline preview (not a deployment)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m1-real-baseline-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/m1-retained-identity/
          if-no-files-found: error
          retention-days: 7
      - name: Retain real baseline runtime screenshots separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-real-baseline-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/local-real-identity-browser/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Retain synthetic runtime screenshots for later visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-synthetic-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/local-m1-browser/*.png
          if-no-files-found: warn
          retention-days: 7
