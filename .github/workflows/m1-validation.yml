# Offline M1 source acceptance; no Wikimedia calls or deployment.
name: M1 identity and visitor acceptance
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visitor:
    name: M1 synthetic visitor and source contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic synthetic projection
        run: python -m tools.m1_build_preview --check
      - name: Verify immutable identity-history comparison
        run: python -m unittest discover -s tests -p 'test_m1_identity_history.py' -v
      - name: Build labelled synthetic identity-history example
        run: |
          mkdir -p artifacts
          python -m tools.m1_identity_history_demo artifacts/m1-identity-history
      - name: Retain synthetic identity-history report (not real observations)
        uses: actions/upload-artifact@v4
        with:
          name: m1-identity-history-synthetic-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/m1-identity-history/
          if-no-files-found: error
          retention-days: 7
      - name: Verify and build retained real identity baseline (no collection)
        run: |
          python -m unittest discover -s tests -p 'test_m1_retained_identity.py' -v
          python -m tools.m1_retained_identity artifacts/m1-retained-identity
          python -m tools.m1_retained_identity --check artifacts/m1-retained-identity
      - name: Exercise JavaScript state and bounded transport
        run: |
          node tests/js_m1_share.cjs
          node tests/js_identity_explorer.cjs
          node tests/js_curated_explorer.cjs
      - name: Install pinned Playwright Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Normal local HTTP browser journey, not a public deployment
        run: python tests/m1/browser_preview.py
      - name: Verify rolling-source atlas with local HTTP Chromium (synthetic fixture)
        run: python tests/m1/browser_rolling_snapshot_preview.py
      - name: Verify identity-history evidence with local HTTP Chromium (synthetic fixture)
        run: python tests/m1/browser_identity_history.py
      - name: Verify retained real identity baseline with local HTTP Chromium
        run: python tests/m1/browser_retained_identity.py
      - name: Retain real baseline preview (not a deployment)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m1-real-baseline-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/m1-retained-identity/
          if-no-files-found: error
          retention-days: 7
      - name: Retain real baseline runtime screenshots separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-real-baseline-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/local-real-identity-browser/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Retain synthetic runtime screenshots for later visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-synthetic-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/local-m1-browser/*.png
          if-no-files-found: warn
          retention-days: 7
