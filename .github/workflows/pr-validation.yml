name: Offline PR validation

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dayflare-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout exact proposed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-18
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-10-18
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test-only HTML and CSS parsers
        run: python -m pip install -r requirements-test.txt
      - name: Run all offline regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile source and tests
        run: python -m compileall -q tools tests
      - name: Build real-source Nov 18 local atlas from Git-retained evidence
        if: matrix.python-version == '3.13'
        run: |
          mkdir -p artifacts
          python -m tools.m1_20_local_atlas artifacts/m1-20-20261118-local
      - name: Retain dated real-source local atlas (not a deployment)
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m1-20-20261118-local-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/m1-20-20261118-local/
          if-no-files-found: error
          retention-days: 14
      - name: Build real-source dated M1 release candidate (NO deployment)
        if: matrix.python-version == '3.13'
        run: |
          python -m tools.m1_20_release_candidate artifacts/m1-20-20261118-candidate
      - name: Retain source-gated M1 candidate for independent review (NOT live)
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m1-20-20261118-release-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/m1-20-20261118-candidate/
          include-hidden-files: true # retain the required empty .nojekyll member
          if-no-files-found: error
          retention-days: 14
      - name: Build dated unpublished 30-title portable ZIP from Git-retained evidence
        if: matrix.python-version == '3.13'
        run: |
          mkdir -p artifacts
          python -m tools.m1_30_portable_bundle --output artifacts/dayflare-30-20261117-partial.zip
          sha256sum artifacts/dayflare-30-20261117-partial.zip
      - name: Retain offline partial-source atlas (not a deployment or release approval)
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, GitHub ref verified 2026-11-20
        with:
          name: m1-30-unpublished-portable-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/dayflare-30-20261117-partial.zip
          if-no-files-found: error
          retention-days: 14
