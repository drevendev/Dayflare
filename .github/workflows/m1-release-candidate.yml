# Read-only, reusable release-branch acceptance. No Pages deployment or live-URL claim.
# The manifest digest is pinned from a separate exact-content review, not read
# from the candidate as the sole trust anchor. Update it only on a reviewed release.
name: M1 release-candidate Chromium acceptance

on:
  push:
    paths:
      - 'm1/**'
      - '.github/workflows/m1-release-candidate.yml'
  pull_request:
    paths:
      - 'm1/**'
      - '.github/workflows/m1-release-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate without stored credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: release
          persist-credentials: false
      - name: Checkout previously reviewed acceptance tools
        uses: actions/checkout@v6
        with:
          ref: 9fb5c70206354af355a2e5495bf0d622f5824fe0
          path: source
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exact manifest and 20/700 observations (fail closed)
        run: |
          PYTHONPATH=source python -m tools.m1_branch_acceptance \
            --site-root release \
            --accepted-manifest-sha256 a0bafa44b404c1d8509cd1541ef61d0fbd4f8b9bba15fba94e4bca014d5cdbb4
      - name: Run existing negative-control acceptance tests
        run: PYTHONPATH=source python -m unittest discover -s source/tests -p test_m1_branch_acceptance.py -v
      - name: Install pinned Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test exact candidate via local HTTP and Chromium
        run: |
          python source/tests/m1/browser_branch_acceptance.py \
            --site-root release --screenshots m1-runtime-screenshots
      - name: Verify sort, CSV, share restoration and 320/390/1280 layout in Chromium
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          import threading
          from urllib.parse import urljoin, urlsplit, parse_qs, urlencode, urlunsplit
          from playwright.sync_api import sync_playwright

          screenshots = Path("m1-runtime-screenshots")
          screenshots.mkdir(exist_ok=True)
          handler = partial(SimpleHTTPRequestHandler, directory=str(Path("release").resolve()))
          server = ThreadingHTTPServer(("127.0.0.1", 0), handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          try:
              url = f"http://127.0.0.1:{server.server_port}/m1/"
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  for width, height in ((1280, 850), (390, 844), (320, 700)):
                      page = browser.new_page(viewport={"width":width, "height":height},
                                              accept_downloads=True, reduced_motion="reduce")
                      errors = []
                      page.on("pageerror", lambda error: errors.append(str(error)))
                      response = page.goto(url, wait_until="domcontentloaded")
                      assert response and response.status == 200
                      order = page.locator("#atlas-order")
                      assert order.is_visible()
                      assert order.input_value() == "editorial"
                      # Native select option text can clip without page overflow.
                      for mode in ("editorial", "increase", "decrease",
                                   "relative-increase", "relative-decrease"):
                          order.select_option(mode)
                          fit = order.evaluate("""select => {
                              const style = getComputedStyle(select);
                              const context = document.createElement("canvas").getContext("2d");
                              context.font = [style.fontStyle, style.fontWeight,
                                              style.fontSize, style.fontFamily].join(" ");
                              const selected = select.selectedOptions[0].textContent;
                              return {
                                  text: selected,
                                  measured: context.measureText(selected).width,
                                  available: select.clientWidth - parseFloat(style.paddingLeft) -
                                             parseFloat(style.paddingRight) - 28
                              };
                          }""")
                          assert fit["measured"] <= fit["available"], (width, fit)
                      order.select_option("editorial")
                      # Exact-sign filter is a measurement, not a lifecycle label.
                      change = page.locator("#atlas-change")
                      assert change.is_visible() and change.input_value() == "all"
                      # The positive/negative split changes with every real data window.
                      # Validate filter behavior against the signed exact card deltas,
                      # not counts hard-coded from the previous 2026-10-27 release.
                      delta_values = [int(v) for v in page.locator(".cards > .card").evaluate_all(
                          "(els) => els.map(e => e.dataset.delta2)")]
                      assert len(delta_values) == 20
                      filter_counts = {
                          "positive": sum(v > 0 for v in delta_values),
                          "negative": sum(v < 0 for v in delta_values),
                          "unchanged": sum(v == 0 for v in delta_values),
                          "all": len(delta_values),
                      }
                      assert filter_counts["positive"] and filter_counts["negative"]
                      for mode, expected in filter_counts.items():
                          change.select_option(mode)
                          assert page.locator(".card:visible").count() == expected, (width, mode)
                          assert page.locator("#compare-table tbody tr:visible").count() == expected
                          if mode == "unchanged" and not expected:
                              assert page.locator("#atlas-empty").is_visible()
                              assert page.locator("#compare-empty").is_visible()
                      change.select_option("positive")
                      positive_link = page.locator("#atlas-filter-link").get_attribute("href")
                      assert positive_link and "af_change=positive" in positive_link
                      page.goto(urljoin(page.url, positive_link), wait_until="domcontentloaded")
                      assert page.locator("#atlas-change").input_value() == "positive"
                      page.locator("#atlas-change").select_option("all")
                      assert page.locator(".card:visible").count() == 20
                      order = page.locator("#atlas-order")
                      order.select_option("increase")
                      cards = page.locator(".card:visible")
                      rows = page.locator("#compare-table tbody tr:visible")
                      values = [int(v) for v in cards.evaluate_all(
                          "(els) => els.map(e => e.dataset.delta2)")]
                      assert len(values) == 20 and values == sorted(values, reverse=True)
                      ids = cards.evaluate_all("(els) => els.map(e => e.dataset.series)")
                      assert ids == rows.evaluate_all("(els) => els.map(e => e.dataset.series)")
                      link = page.locator("#atlas-filter-link").get_attribute("href")
                      assert link and "af_sort=increase" in link
                      page.goto(urljoin(page.url, link), wait_until="domcontentloaded")
                      assert page.locator("#atlas-order").input_value() == "increase"
                      order = page.locator("#atlas-order")
                      order.select_option("decrease")
                      values = [int(v) for v in cards.evaluate_all(
                          "(els) => els.map(e => e.dataset.delta2)")]
                      assert values == sorted(values)
                      # Independent exact-rational test of the reviewed #105 M1 UI.
                      for relative_mode, reverse in (("relative-increase", True),
                                                     ("relative-decrease", False)):
                          order.select_option(relative_mode)
                          ranking = cards.evaluate_all(
                              "(els) => els.map(e => [e.dataset.series, e.dataset.delta2, e.dataset.baseline2])")
                          from fractions import Fraction
                          ratios = [None if int(baseline) == 0 else
                                    Fraction(int(delta), int(baseline))
                                    for _, delta, baseline in ranking]
                          comparable = [ratio for ratio in ratios if ratio is not None]
                          assert comparable == sorted(comparable, reverse=reverse)
                          assert ratios[len(comparable):] == [None] * (len(ratios) - len(comparable))
                          assert [ident for ident, _, _ in ranking] == rows.evaluate_all(
                              "(els) => els.map(e => e.dataset.series)")
                      # Synthetic zero-baseline negative control: never invent %.
                      zero = page.locator(".cards > .card").first
                      zero_id = zero.get_attribute("data-series")
                      saved_base = zero.get_attribute("data-baseline2")
                      zero.evaluate("(node) => node.dataset.baseline2 = '0'")
                      order.select_option("relative-increase")
                      assert page.locator(".cards > .card").last.get_attribute("data-series") == zero_id
                      page.locator('.card[data-series="' + zero_id + '"]').evaluate(
                          "(node, value) => node.dataset.baseline2 = value", saved_base)
                      order.select_option("relative-increase")
                      relative_link = page.locator("#atlas-filter-link").get_attribute("href")
                      assert relative_link and "af_sort=relative-increase" in relative_link
                      page.goto(urljoin(page.url, relative_link), wait_until="domcontentloaded")
                      assert page.locator("#atlas-order").input_value() == "relative-increase"
                      order = page.locator("#atlas-order")
                      order.select_option("decrease")
                      page.locator("#atlas-edition").select_option("ru.wikipedia")
                      assert cards.count() == 10 and rows.count() == 10
                      ru_ids = cards.evaluate_all("(els) => els.map(e => e.dataset.series)")
                      assert ru_ids == rows.evaluate_all("(els) => els.map(e => e.dataset.series)")
                      with page.expect_download() as pending:
                          page.locator("#compare-csv").click()
                      with Path(pending.value.path()).open(encoding="utf-8-sig", newline="") as stream:
                          exported = list(csv.reader(stream))
                      assert len(exported) == 11
                      assert [row[3] for row in exported[1:]] == ru_ids
                      link = page.locator("#atlas-filter-link").get_attribute("href")
                      assert link and "af_sort=decrease" in link
                      page.goto(urljoin(page.url, link), wait_until="domcontentloaded")
                      assert page.locator("#atlas-order").input_value() == "decrease"
                      assert cards.count() == 10
                      assert page.evaluate("document.documentElement.scrollWidth") <= width
                      page.screenshot(path=str(screenshots / f"m1-release-sorted-{width}.png"),
                                      full_page=False)
                      parts = urlsplit(page.url)
                      query = parse_qs(parts.query)
                      query["af_sort"] = ["invalid"]
                      invalid = urlunsplit((parts.scheme, parts.netloc, parts.path,
                                          urlencode(query, doseq=True), parts.fragment))
                      page.goto(invalid, wait_until="domcontentloaded")
                      assert page.locator("#atlas-filter-warning").is_visible()
                      assert page.locator("#atlas-order").input_value() == "editorial"
                      assert cards.count() == 20
                      assert page.evaluate("document.documentElement.scrollWidth") <= width
                      assert not errors, errors
                      page.screenshot(path=str(screenshots / f"m1-release-invalid-link-{width}.png"),
                                      full_page=False)
                      page.close()
                  browser.close()
          finally:
              server.shutdown()
              thread.join(timeout=5)
          print("PASS: exact candidate Chromium sort/CSV/share/invalid-link/320-390-1280")
          print("BRANCH_TEST_ONLY: no Pages HTTP or live deployment assertion")
          PY
      - name: Retain real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-release-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: m1-runtime-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
