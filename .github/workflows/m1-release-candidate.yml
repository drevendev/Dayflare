# Read-only, reusable release-branch acceptance. No Pages deployment or live-URL claim.
# The manifest digest is pinned from a separate exact-content review, not read
# from the candidate as the sole trust anchor. Update it only on a reviewed release.
name: M1 release-candidate Chromium acceptance

on:
  push:
    branches:
      - gh-pages
  pull_request:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate without stored credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: release
          persist-credentials: false
      - name: Checkout previously reviewed acceptance tools
        uses: actions/checkout@v6
        with:
          ref: 9fb5c70206354af355a2e5495bf0d622f5824fe0
          path: source
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate release root, linked M1 and fail-closed negative controls
        shell: bash
        run: |
          python - <<'PY'
          from datetime import date, datetime, timezone
          from hashlib import sha256
          import json
          from pathlib import Path
          import re
          
          ROOT = Path("release")
          M1_PIN = "7000c16acb4c9b4ef47018125128235e49ef3346b5f2e05f7c64f947544d5571"
          WORKFLOW = ".github/workflows/m1-release-candidate.yml"
          RAW_LINK = "https://raw.githubusercontent.com/drevendev/Dayflare/gh-pages/m1/index.html"
          
          def sha(data):
              return sha256(data).hexdigest()
          
          def unique(pairs):
              out = {}
              for key, value in pairs:
                  if key in out:
                      raise ValueError("duplicate manifest key: " + key)
                  out[key] = value
              return out
          
          def parse(data):
              return json.loads(data.decode("utf-8"), object_pairs_hook=unique)
          
          def accept(files, m1_manifest_bytes, m1_html):
              assert "release-manifest.json" in files, "missing root manifest"
              manifest = parse(files["release-manifest.json"])
              expected = manifest.get("files_sha256")
              assert manifest.get("status") == "UNPUBLISHED_STATIC_RELEASE_CANDIDATE"
              assert type(expected) is dict and len(expected) == 16
              actual = set(files) - {"release-manifest.json"}
              assert set(expected) == actual, f"root inventory mismatch: {actual ^ set(expected)}"
              assert files[".nojekyll"] == b""
              for name, content in files.items():
                  if name == "release-manifest.json":
                      continue
                  assert re.fullmatch(r"[a-f0-9]{64}", expected[name]), "bad root digest"
                  assert sha(content) == expected[name], "root digest mismatch: " + name
              assert sha(m1_manifest_bytes) == M1_PIN, "M1 independent manifest pin changed"
              m1 = parse(m1_manifest_bytes)
              assert m1["status"] == "DATED_ARCHIVE_NOT_LIVE"
              assert (m1["series"], m1["daily_observations"]) == (20, 700)
              assert m1["method_version"] == "v0-empirical-35d"
              assert sha(m1_html) == m1["html_sha256"], "M1 HTML checksum mismatch"
              observed = date.fromisoformat(m1["observation_end"])
              retrieved = datetime.fromisoformat(m1["retrieved_at"].replace("Z", "+00:00"))
              assert retrieved.tzinfo == timezone.utc and retrieved.date() > observed
              html = files["index.html"].decode("utf-8")
              hero_match = re.search(r'<section class="hero"[^>]*>.*?</section>', html, re.S)
              assert hero_match, "missing release root hero"
              hero = hero_match.group()
              for phrase in (
                  "ACCEPTED DATED M1 ARCHIVE",
                  "20 selected EN/RU title histories",
                  "700 exact daily observations",
                  "not a verified hosted service",
                  "exact observation window",
                  "retrieval timestamp",
                  "dataset and method",
                  "versioned release manifest",
              ):
                  assert phrase in hero, "root archive disclosure missing: " + phrase
              assert "22 Sep – 26 Oct 2026 UTC" not in hero, "obsolete observation caption"
              assert "retrieved 29 Oct 2026" not in hero, "obsolete retrieval caption"
              # Current-M1 dates belong to the independently pinned M1 manifest.
              # Guard the whole visible current-archive hero copy, including .intro.
              # Exclude clearly labelled earlier-sample spotlight and Earlier links.
              current_copy, earlier_sep, _ = hero.partition('<aside class="spotlight"')
              assert earlier_sep and '<div class="hero-copy">' in current_copy, (
                  "unrecognized current/earlier hero boundary")
              assert '<div class="hero-foot"' in current_copy, "missing root disclosure footer"
              current_copy = re.sub(r'<a\b[^>]*>\s*Earlier\b.*?</a>', "",
                                    current_copy, flags=re.I | re.S)
              current_text = re.sub(r"<[^>]*>", " ", current_copy)
              month = r"(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*"
              calendar_claim = (r"\b(?:\d{4}-\d{2}-\d{2}|\d{1,2}\s+" + month
                                + r"\b|" + month + r"\s+\d{1,2}\b|"
                                + month + r"\s+\d{4}\b)")
              assert not re.search(calendar_claim, current_text, flags=re.I), (
                  "unverified current-M1 date in root hero; use pinned M1 manifest")
              assert ('id="latest-atlas" href="' + RAW_LINK + '"') in hero, "broken fallback CTA"
              assert "blob/gh-pages/m1/release-manifest.json" in hero, "missing M1 evidence link"
          
          files = {}
          for member in ROOT.rglob("*"):
              assert not member.is_symlink(), "release symlinks are forbidden"
              if not member.is_file():
                  continue
              name = member.relative_to(ROOT).as_posix()
              if name.startswith(".git/") or name == ".git":
                  continue
              if name.startswith("m1/"):
                  continue
              if name.startswith(".github/"):
                  assert name == WORKFLOW, "unexpected publication workflow"
                  continue
              files[name] = member.read_bytes()
          m1_manifest_bytes = (ROOT / "m1/release-manifest.json").read_bytes()
          m1_html = (ROOT / "m1/index.html").read_bytes()
          accept(files, m1_manifest_bytes, m1_html)
          
          def must_reject(case, modified, manifest=m1_manifest_bytes, html=m1_html):
              try:
                  accept(modified, manifest, html)
              except (AssertionError, KeyError, ValueError, UnicodeError):
                  return
              raise AssertionError("negative control unexpectedly passed: " + case)
          
          missing = dict(files)
          missing.pop("styles.css")
          must_reject("missing release asset", missing)
          corrupt = dict(files)
          corrupt["styles.css"] += b"\n"
          must_reject("root asset digest mismatch", corrupt)
          
          def changed_hero(before, after):
              new = dict(files)
              new["index.html"] = files["index.html"].replace(before, after, 1)
              assert new["index.html"] != files["index.html"], "negative fixture not applied"
              root_manifest = parse(files["release-manifest.json"])
              root_manifest["files_sha256"]["index.html"] = sha(new["index.html"])
              new["release-manifest.json"] = json.dumps(root_manifest).encode("utf-8")
              return new
          
          must_reject("wrong observation date retaining accepted marker and matching SHA",
              changed_hero(b"The linked HTML is a downloadable file",
                  b"observed 25 Sep - 28 Oct 2026 UTC; The linked HTML is a downloadable file"))
          must_reject("wrong retrieval date retaining accepted marker and matching SHA",
              changed_hero(b"Save and open the downloaded HTML locally;",
                  b"retrieved 30 Oct 2026; Save and open the downloaded HTML locally;"))
          must_reject("wrong current M1 intro dates with matching SHA and intact marker",
              changed_hero(b"Inspect complete 35-day counts and source evidence;",
                  b"Latest M1 observed 25 Sep - 28 Oct 2026 UTC; retrieved 30 Oct 2026. "
                  b"Inspect complete 35-day counts and source evidence;"))
          must_reject("broken CTA even with refreshed digest",
              changed_hero(RAW_LINK.encode(), b"/missing-m1-atlas.html"))
          must_reject("changed M1 manifest pin", files, m1_manifest_bytes + b"\n")
          print("PASS: root 16/16, independently pinned 20/700 M1, CTA and archive disclosure")
          print("PASS: 7 fail-closed negative controls (missing/hash/footer observation/footer retrieval/intro dates/CTA/M1 pin)")
          print("BRANCH_TEST_ONLY: no public Pages HTTP verification")
          PY
      - name: Verify exact manifest and 20/700 observations (fail closed)
        run: |
          PYTHONPATH=source python -m tools.m1_branch_acceptance \
            --site-root release \
            --accepted-manifest-sha256 7000c16acb4c9b4ef47018125128235e49ef3346b5f2e05f7c64f947544d5571
      - name: Run existing negative-control acceptance tests
        run: PYTHONPATH=source python -m unittest discover -s source/tests -p test_m1_branch_acceptance.py -v
      - name: Install pinned Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test exact candidate via local HTTP and Chromium
        run: |
          python source/tests/m1/browser_branch_acceptance.py \
            --site-root release --screenshots m1-runtime-screenshots
      - name: Verify sort, CSV, share restoration and 320/390/1280 layout in Chromium
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          import threading
          from urllib.parse import urljoin, urlsplit, parse_qs, urlencode, urlunsplit
          from playwright.sync_api import sync_playwright

          screenshots = Path("m1-runtime-screenshots")
          screenshots.mkdir(exist_ok=True)
          handler = partial(SimpleHTTPRequestHandler, directory=str(Path("release").resolve()))
          server = ThreadingHTTPServer(("127.0.0.1", 0), handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          try:
              url = f"http://127.0.0.1:{server.server_port}/m1/"
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  for width, height in ((1280, 850), (390, 844), (320, 700)):
                      page = browser.new_page(viewport={"width":width, "height":height},
                                              accept_downloads=True, reduced_motion="reduce")
                      errors = []
                      page.on("pageerror", lambda error: errors.append(str(error)))
                      response = page.goto(url, wait_until="domcontentloaded")
                      assert response and response.status == 200
                      # Validate 35-point static charts against exact dated evidence.
                      details = page.locator('article[id^="detail-"]')
                      assert details.count() == 20
                      for detail in details.all():
                          table_rows = detail.locator(".scroll table tbody tr")
                          assert table_rows.count() == 35
                          pairs = [(row.locator("th").inner_text().strip(),
                                    int(row.locator("td").inner_text().strip().replace(",", "")))
                                   for row in table_rows.all()]
                          assert pairs[0][0] == "2026-10-01" and pairs[-1][0] == "2026-11-04"
                          peak = max(v for _, v in pairs)
                          svg = detail.locator(".daily-curve svg[role=img]")
                          assert svg.count() == 1
                          assert svg.get_attribute("aria-label") == (
                              "Daily requests, 2026-10-01 to 2026-11-04 UTC; peak "
                              + f"{peak:,} requests; zero-origin chart. Exact values in the table below.")
                          expected = " ".join(
                              f"{12+i*10},{90-((v*74+peak//2)//peak if peak else 0)}"
                              for i, (_, v) in enumerate(pairs))
                          assert svg.locator(".daily-line").get_attribute("points") == expected
                          assert detail.locator(".daily-zero").get_attribute("y1") == "90"
                          assert svg.evaluate("(el) => el.getBoundingClientRect().right") <= width
                      assert page.locator(".daily-curve").count() == 20
                      order = page.locator("#atlas-order")
                      assert order.is_visible()
                      assert order.input_value() == "editorial"
                      # Native select option text can clip without page overflow.
                      for mode in ("editorial", "increase", "decrease",
                                   "relative-increase", "relative-decrease"):
                          order.select_option(mode)
                          fit = order.evaluate("""select => {
                              const style = getComputedStyle(select);
                              const context = document.createElement("canvas").getContext("2d");
                              context.font = [style.fontStyle, style.fontWeight,
                                              style.fontSize, style.fontFamily].join(" ");
                              const selected = select.selectedOptions[0].textContent;
                              return {
                                  text: selected,
                                  measured: context.measureText(selected).width,
                                  available: select.clientWidth - parseFloat(style.paddingLeft) -
                                             parseFloat(style.paddingRight) - 28
                              };
                          }""")
                          assert fit["measured"] <= fit["available"], (width, fit)
                      order.select_option("editorial")
                      # Exact-sign filter is a measurement, not a lifecycle label.
                      change = page.locator("#atlas-change")
                      assert change.is_visible() and change.input_value() == "all"
                      # The positive/negative split changes with every real data window.
                      # Validate filter behavior against the signed exact card deltas,
                      # not counts hard-coded from the previous 2026-10-27 release.
                      delta_values = [int(v) for v in page.locator(".cards > .card").evaluate_all(
                          "(els) => els.map(e => e.dataset.delta2)")]
                      assert len(delta_values) == 20
                      filter_counts = {
                          "positive": sum(v > 0 for v in delta_values),
                          "negative": sum(v < 0 for v in delta_values),
                          "unchanged": sum(v == 0 for v in delta_values),
                          "all": len(delta_values),
                      }
                      assert filter_counts["positive"] and filter_counts["negative"]
                      for mode, expected in filter_counts.items():
                          change.select_option(mode)
                          assert page.locator(".card:visible").count() == expected, (width, mode)
                          assert page.locator("#compare-table tbody tr:visible").count() == expected
                          if mode == "unchanged" and not expected:
                              assert page.locator("#atlas-empty").is_visible()
                              assert page.locator("#compare-empty").is_visible()
                      change.select_option("positive")
                      positive_link = page.locator("#atlas-filter-link").get_attribute("href")
                      assert positive_link and "af_change=positive" in positive_link
                      page.goto(urljoin(page.url, positive_link), wait_until="domcontentloaded")
                      assert page.locator("#atlas-change").input_value() == "positive"
                      page.locator("#atlas-change").select_option("all")
                      assert page.locator(".card:visible").count() == 20
                      order = page.locator("#atlas-order")
                      order.select_option("increase")
                      cards = page.locator(".card:visible")
                      rows = page.locator("#compare-table tbody tr:visible")
                      values = [int(v) for v in cards.evaluate_all(
                          "(els) => els.map(e => e.dataset.delta2)")]
                      assert len(values) == 20 and values == sorted(values, reverse=True)
                      ids = cards.evaluate_all("(els) => els.map(e => e.dataset.series)")
                      assert ids == rows.evaluate_all("(els) => els.map(e => e.dataset.series)")
                      link = page.locator("#atlas-filter-link").get_attribute("href")
                      assert link and "af_sort=increase" in link
                      page.goto(urljoin(page.url, link), wait_until="domcontentloaded")
                      assert page.locator("#atlas-order").input_value() == "increase"
                      order = page.locator("#atlas-order")
                      order.select_option("decrease")
                      values = [int(v) for v in cards.evaluate_all(
                          "(els) => els.map(e => e.dataset.delta2)")]
                      assert values == sorted(values)
                      # Independent exact-rational test of the reviewed #105 M1 UI.
                      for relative_mode, reverse in (("relative-increase", True),
                                                     ("relative-decrease", False)):
                          order.select_option(relative_mode)
                          ranking = cards.evaluate_all(
                              "(els) => els.map(e => [e.dataset.series, e.dataset.delta2, e.dataset.baseline2])")
                          from fractions import Fraction
                          ratios = [None if int(baseline) == 0 else
                                    Fraction(int(delta), int(baseline))
                                    for _, delta, baseline in ranking]
                          comparable = [ratio for ratio in ratios if ratio is not None]
                          assert comparable == sorted(comparable, reverse=reverse)
                          assert ratios[len(comparable):] == [None] * (len(ratios) - len(comparable))
                          assert [ident for ident, _, _ in ranking] == rows.evaluate_all(
                              "(els) => els.map(e => e.dataset.series)")
                      # Synthetic zero-baseline negative control: never invent %.
                      zero = page.locator(".cards > .card").first
                      zero_id = zero.get_attribute("data-series")
                      saved_base = zero.get_attribute("data-baseline2")
                      zero.evaluate("(node) => node.dataset.baseline2 = '0'")
                      order.select_option("relative-increase")
                      assert page.locator(".cards > .card").last.get_attribute("data-series") == zero_id
                      page.locator('.card[data-series="' + zero_id + '"]').evaluate(
                          "(node, value) => node.dataset.baseline2 = value", saved_base)
                      order.select_option("relative-increase")
                      relative_link = page.locator("#atlas-filter-link").get_attribute("href")
                      assert relative_link and "af_sort=relative-increase" in relative_link
                      page.goto(urljoin(page.url, relative_link), wait_until="domcontentloaded")
                      assert page.locator("#atlas-order").input_value() == "relative-increase"
                      order = page.locator("#atlas-order")
                      order.select_option("decrease")
                      page.locator("#atlas-edition").select_option("ru.wikipedia")
                      assert cards.count() == 10 and rows.count() == 10
                      ru_ids = cards.evaluate_all("(els) => els.map(e => e.dataset.series)")
                      assert ru_ids == rows.evaluate_all("(els) => els.map(e => e.dataset.series)")
                      with page.expect_download() as pending:
                          page.locator("#compare-csv").click()
                      with Path(pending.value.path()).open(encoding="utf-8-sig", newline="") as stream:
                          exported = list(csv.reader(stream))
                      assert len(exported) == 11
                      assert [row[3] for row in exported[1:]] == ru_ids
                      assert page.locator("#compare-daily-csv").is_visible()
                      assert page.locator("#compare-daily-csv").evaluate(
                          "(el) => el.getBoundingClientRect().height >= 44 && "
                          "getComputedStyle(el).backgroundColor === "
                          "getComputedStyle(document.getElementById('compare-csv')).backgroundColor")
                      with page.expect_download() as daily_download:
                          page.locator("#compare-daily-csv").click()
                      with Path(daily_download.value.path()).open(encoding="utf-8-sig", newline="") as stream:
                          exact_daily = list(csv.reader(stream))
                      assert exact_daily[0] == [
                          "dataset_sha256", "method_version", "observation_end_utc",
                          "snapshot_series_key", "edition", "title", "subject",
                          "utc_date", "daily_requests",
                      ]
                      assert len(exact_daily) == 1 + len(ru_ids) * 35
                      evidence = page.locator("#share-restore")
                      for idx, identity in enumerate(ru_ids):
                          group = exact_daily[1 + idx * 35:1 + (idx + 1) * 35]
                          assert len(group) == 35
                          assert all(record[3] == identity for record in group)
                          source_table = page.locator(f'[id="{identity}"] .scroll table tbody tr')
                          source_values = source_table.evaluate_all(
                              "(els) => els.map(r => [r.children[0].textContent.trim(), "
                              "r.children[1].textContent.trim()])")
                          assert len(source_values) == 35
                          for record, (day, count) in zip(group, source_values):
                              assert record[0] == evidence.get_attribute("data-dataset")
                              assert record[1] == evidence.get_attribute("data-method")
                              assert record[2] == evidence.get_attribute("data-end")
                              assert record[4] == "ru.wikipedia"
                              assert record[7] == day
                              assert int(record[8]) == int(count.replace(",", "").replace(" ", ""))
                      # Identical visible-row count is NOT sufficient: reject a wrong key.
                      row = page.locator("#compare-table tbody tr:visible").first
                      saved_key = row.get_attribute("data-series")
                      row.evaluate("(node) => node.dataset.series = 'unmatched-key'")
                      page.locator("#compare-daily-csv").click()
                      assert "Daily CSV unavailable" in page.locator(
                          "#compare-daily-csv-status").inner_text()
                      row.evaluate("(node, key) => node.dataset.series = key", saved_key)
                      # Do not turn invalid source evidence into zero or a download.
                      daily_cell = page.locator(
                          f'[id="{ru_ids[0]}"] .scroll table tbody tr').first.locator("td")
                      saved_count = daily_cell.inner_text()
                      daily_cell.evaluate("(node) => node.textContent = 'not-a-count'")
                      page.locator("#compare-daily-csv").click()
                      assert "Daily CSV unavailable" in page.locator(
                          "#compare-daily-csv-status").inner_text()
                      daily_cell.evaluate("(node, value) => node.textContent = value", saved_count)
                      link = page.locator("#atlas-filter-link").get_attribute("href")
                      assert link and "af_sort=decrease" in link
                      page.goto(urljoin(page.url, link), wait_until="domcontentloaded")
                      assert page.locator("#atlas-order").input_value() == "decrease"
                      assert cards.count() == 10
                      assert page.evaluate("document.documentElement.scrollWidth") <= width
                      page.screenshot(path=str(screenshots / f"m1-release-sorted-{width}.png"),
                                      full_page=False)
                      parts = urlsplit(page.url)
                      query = parse_qs(parts.query)
                      query["af_sort"] = ["invalid"]
                      invalid = urlunsplit((parts.scheme, parts.netloc, parts.path,
                                          urlencode(query, doseq=True), parts.fragment))
                      page.goto(invalid, wait_until="domcontentloaded")
                      assert page.locator("#atlas-filter-warning").is_visible()
                      assert page.locator("#atlas-order").input_value() == "editorial"
                      assert cards.count() == 20
                      assert page.evaluate("document.documentElement.scrollWidth") <= width
                      assert not errors, errors
                      page.screenshot(path=str(screenshots / f"m1-release-invalid-link-{width}.png"),
                                      full_page=False)
                      page.close()
                  # Charts remain visible with JavaScript disabled.
                  nojs_context = browser.new_context(java_script_enabled=False,
                      viewport={"width":320,"height":700},reduced_motion="reduce")
                  nojs_page = nojs_context.new_page()
                  response_nojs = nojs_page.goto(url, wait_until="domcontentloaded")
                  assert response_nojs and response_nojs.status == 200
                  assert nojs_page.locator("article .daily-curve svg[role=img]").count() == 20
                  assert nojs_page.locator("article .scroll table tbody tr").count() == 700
                  assert nojs_page.evaluate("document.documentElement.scrollWidth") <= 320
                  nojs_context.close()
                  browser.close()
          finally:
              server.shutdown()
              thread.join(timeout=5)
          print("PASS: exact candidate Chromium sort/CSV/share/invalid-link/320-390-1280")
          print("BRANCH_TEST_ONLY: no Pages HTTP or live deployment assertion")
          PY
      - name: Test root hero, focus, no-JS and 320/390/1280 using real HTTP Chromium
        shell: bash
        run: |
          python - <<'PY'
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          import threading
          from playwright.sync_api import sync_playwright
          
          out = Path("m1-runtime-screenshots")
          out.mkdir(exist_ok=True)
          handler = partial(SimpleHTTPRequestHandler, directory=str(Path("release").resolve()))
          server = ThreadingHTTPServer(("127.0.0.1", 0), handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          try:
              root = f"http://127.0.0.1:{server.server_port}/"
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  for width, height in ((320, 700), (390, 844), (1280, 850)):
                      for js in (False, True):
                          page = browser.new_page(viewport={"width": width, "height": height},
                                                  java_script_enabled=js, reduced_motion="reduce")
                          response = page.goto(root, wait_until="domcontentloaded")
                          assert response and response.status == 200
                          assert page.locator("#latest-atlas").is_visible()
                          assert "ACCEPTED DATED M1 ARCHIVE" in page.locator(".hero-foot").inner_text()
                          href = page.locator("#latest-atlas").get_attribute("href")
                          assert href == "https://raw.githubusercontent.com/drevendev/Dayflare/gh-pages/m1/index.html"
                          assert page.locator("#discover").count() == 1
                          assert page.evaluate("document.documentElement.scrollWidth") <= width
                          page.keyboard.press("Tab")
                          assert page.evaluate("document.activeElement.classList.contains('skip')")
                          assert page.locator(".skip").evaluate(
                              "(el) => getComputedStyle(el).outlineStyle") != "none"
                          page.screenshot(path=str(out / f"root-release-{'js' if js else 'nojs'}-{width}.png"),
                                          full_page=False)
                          if not js:
                              m1 = page.goto(root + "m1/", wait_until="domcontentloaded")
                              assert m1 and m1.status == 200
                              assert page.locator(".card").count() == 20
                              assert page.evaluate("document.documentElement.scrollWidth") <= width
                          page.close()
                  browser.close()
          finally:
              server.shutdown()
              thread.join(timeout=5)
          print("PASS: native loopback HTTP + Chromium root, no-JS/JS, 320/390/1280, keyboard, M1")
          print("BRANCH_TEST_ONLY: no public Pages HTTP/served-revision claim")
          PY
      - name: Retain real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-release-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: m1-runtime-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
