# Read-only, bounded provider experiment; artifacts require human/source acceptance
# before dataset adoption or site publishing. No secrets and no Pages permissions.
name: M1 real EN/RU identity evidence (30 candidates, unpublished)

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/m1-real-identity-evidence.yml
      - tools/m1_title_discovery.py
      - tools/m1_collect.py
      - tools/m1_source_verify.py
      - tools/m1_bundle_verify.py
      - tests/test_m1_title_discovery.py
      - examples/m1_curated_cross_subject_enru.json
      - examples/m1_curated_expanded_30_enru.json
  workflow_dispatch:
    inputs:
      task:
        description: 'Explicit source operation; stable-ID follow-up is manual and unpublished'
        required: true
        type: choice
        default: discover
        options: [discover, stable-id-followup]

permissions:
  contents: read

concurrency:
  group: dayflare-m1-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.task == 'discover' }}
    name: Acquire and independently re-query selected current page IDs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source commit without persistent credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.13 standard-library source tools
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test offline discovery and enforce 30-title EN/RU selection
        run: |
          python -m unittest discover -s tests -p 'test_m1_title_discovery.py' -v
          python - <<'PY'
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          from tools.m1_title_discovery import read_json, validate_curated
          input_path = Path("examples/m1_curated_expanded_30_enru.json")
          rows = validate_curated(read_json(input_path), datetime.now(timezone.utc).date())
          if len(rows) != 30 or {p["project"] for p in rows} != {"en.wikipedia", "ru.wikipedia"}:
              raise SystemExit("Expected exactly 30 reviewed EN/RU editorial candidates")
          if {p["subject"] for p in rows} != {"culture", "books", "games", "science", "sport"}:
              raise SystemExit("Expected five reviewed subject areas")
          coverage = Counter((p["project"], p["subject"]) for p in rows)
          if any(coverage[(edition, subject)] != 3
                 for edition in ("en.wikipedia", "ru.wikipedia")
                 for subject in ("culture", "books", "games", "science", "sport")):
              raise SystemExit("Expected three editorial candidates per edition and subject")
          if any(p["relation"] != "ambiguous" for p in rows):
              raise SystemExit("Unreviewed cross-edition equivalence assertion")
          PY
      - name: Collect 30 current title-to-ID candidates with exact raw receipts
        run: |
          mkdir -p artifacts
          python -m tools.m1_title_discovery examples/m1_curated_expanded_30_enru.json artifacts/m1-title
          python -m tools.m1_title_discovery --verify examples/m1_curated_expanded_30_enru.json artifacts/m1-title
      - name: Re-query numeric IDs and verify full independent source bundle
        run: |
          python -m tools.m1_collect artifacts/m1-title/identity-seeds.json artifacts/m1-identity
          python -m tools.m1_source_verify artifacts/m1-identity/panel.json artifacts/m1-identity/raw
          python -m tools.m1_bundle_verify artifacts/m1-identity
      - name: Record actual coverage, hashes, commit and limitations
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from hashlib import sha256
          import json
          import os
          from pathlib import Path

          root = Path("artifacts")
          load = lambda path: json.loads(path.read_text(encoding="utf-8"))
          discovery = load(root / "m1-title" / "discovery-report.json")
          seeds = load(root / "m1-title" / "identity-seeds.json")
          collection = load(root / "m1-identity" / "collection-report.json")
          panel = load(root / "m1-identity" / "panel.json")
          if discovery["requested_count"] != 30 or discovery["candidate_count"] != len(seeds["pages"]):
              raise SystemExit("Discovery counts disagree with retained seeds")
          if collection["intended_count"] != discovery["candidate_count"]:
              raise SystemExit("Independent ID re-query failed to cover candidate set")
          if collection["retained_count"] != len(panel["pages"]):
              raise SystemExit("Reported real panel coverage disagrees with retained pages")
          wanted = {(x["page_ref"]["project"], x["page_ref"]["page_id"]): x for x in seeds["pages"]}
          observed = {(x["page_ref"]["project"], x["page_ref"]["page_id"]): x for x in panel["pages"]}
          if len(wanted) != len(seeds["pages"]) or len(observed) != len(panel["pages"]):
              raise SystemExit("Duplicate stable page reference")
          if not observed or not set(observed) <= set(wanted):
              raise SystemExit("Missing or unexpected independently confirmed ID")
          for key, row in observed.items():
              if any(row[field] != wanted[key][field] for field in ("topic_id", "subject", "relation")):
                  raise SystemExit("Acquired identity differs from selected topic scope")

          title_receipt = root / "m1-title" / "discovery-report.json"
          panel_manifest = root / "m1-identity" / "bundle-manifest.json"
          receipt = {
              "schema_version": "dayflare.m1-runtime-evidence.v1",
              "source_commit": os.environ["SOURCE_SHA"],
              "collected_at_utc": datetime.now(timezone.utc).isoformat(),
              "selected_titles": 30,
              "current_id_candidates": discovery["candidate_count"],
              "title_exclusions": discovery["excluded_count"],
              "independently_retained_identities": collection["retained_count"],
              "independent_requery_unavailable": collection["unavailable_count"],
              "by_edition_subject": collection["obtained_by_edition_subject"],
              "discovery_receipt_sha256": sha256(title_receipt.read_bytes()).hexdigest(),
              "identity_manifest_sha256": sha256(panel_manifest.read_bytes()).hexdigest(),
              "source_scope": "selected EN/RU Action API current page metadata, no pageviews or historical continuity",
              "selection_bias": "30 editorial titles; excludes do not imply zero interest",
              "status": "UNPUBLISHED_REVIEW_REQUIRED",
              "provenance_limit": "Recorded HTTP source bytes and internally verified hashes do not independently authenticate upstream origin",
          }
          target = root / "m1-run-receipt.json"
          target.write_text(json.dumps(receipt, sort_keys=True, separators=(",", ":"),
                                       ensure_ascii=False) + "\n", encoding="utf-8")
          summary = (
              "### Unpublished EN/RU identity evidence\n"
              f"Requested titles: **30**; current ID candidates: **{receipt['current_id_candidates']}**; "
              f"retained after independent page-ID re-query: **{receipt['independently_retained_identities']}**.\n\n"
              "This is **not** live attention, historical ID continuity or a published site. "
              "Review retained raw bodies/rights before adoption.\n"
          )
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(summary)
          PY
      - name: Retain validated, unpublished real API evidence (7 days)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m1-real-identity-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/m1-title/
            artifacts/m1-identity/
            artifacts/m1-run-receipt.json
          if-no-files-found: error
          retention-days: 30

  followup:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'stable-id-followup' }}
    name: Next UTC-day stable-ID evidence (manual, unpublished)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact selected source without persisted credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.13 standard-library source tools
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fail closed before requests on non-master / same-day / near midnight
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          test "$SOURCE_REF" = "refs/heads/master" || { echo 'Manual source acquisition requires accepted master' >&2; exit 2; }
          python -m unittest discover -s tests -p 'test_m1_identity_followup.py' -q
          python - <<'PY'
          from tools.m1_identity_followup import eligible_snapshot, seed_for_same_ids, utc_now
          from tools.m1_retained_identity import load_retained
          panel, _, provenance, _ = load_retained()
          day = eligible_snapshot(panel, provenance, clock=utc_now())
          seed = seed_for_same_ids(panel, day)
          assert len(seed['pages']) == 20
          print(f'ELIGIBLE UTC date={day}; immutable selected page IDs=20; no source request yet')
          PY
      - name: Acquire exactly the pinned 20 local IDs and build unpublished evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p artifacts
          python -m tools.m1_identity_followup artifacts/m1-identity-followup --source-revision "$SOURCE_SHA"
      - name: Independently revalidate complete source and HTML before retention
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from tools.m1_bundle_verify import verify_bundle
          from tools.m1_identity_followup import _manifest, seed_for_same_ids, verify_attempted_selection
          from tools.m1_identity_history import compare_bytes, render_html
          from tools.m1_identity_panel import canonical_bytes
          from tools.m1_retained_identity import load_retained

          folder = Path('artifacts/m1-identity-followup')
          manifest = json.loads((folder / 'manifest.json').read_bytes())
          if manifest != _manifest(folder):
              raise SystemExit('Candidate inventory or exact file hashes do not match')
          receipt = json.loads((folder / 'receipt.json').read_bytes())
          baseline, _, provenance, members = load_retained()
          baseline_bytes = (folder / 'baseline-panel.json').read_bytes()
          later_bytes = (folder / 'followup-source/panel.json').read_bytes()
          if baseline_bytes != members['panel.json']:
              raise SystemExit('Original approved baseline differs')
          if receipt['status'] != 'UNPUBLISHED_SOURCE_REVIEW_REQUIRED' or receipt['source_revision'] != os.environ['SOURCE_SHA']:
              raise SystemExit('Invalid receipt state or source revision')
          if not (receipt['followup_observed_utc'] > receipt['baseline_observed_utc'] == provenance['observation_date_utc']):
              raise SystemExit('Invalid observation chronology')
          proof = verify_bundle(folder / "followup-source")
          if proof['manifest_sha256'] != receipt['followup_source_manifest_sha256']:
              raise SystemExit('Source verification manifest mismatch')
          seed = seed_for_same_ids(baseline, receipt['followup_observed_utc'])
          attempts = json.loads((folder / 'followup-source/collection-report.json').read_bytes())
          verify_attempted_selection(seed, attempts)
          report = compare_bytes(baseline_bytes, later_bytes)
          if (folder / 'history/history.json').read_bytes() != canonical_bytes(report):
              raise SystemExit('Generated history data changed')
          if (folder / 'history/index.html').read_bytes() != render_html(report):
              raise SystemExit('Generated visitor HTML changed')
          if any(row['pageview_join_allowed'] for row in report['pages']):
              raise SystemExit('Unsupported pageview continuity claim')
          if report['evidence_kind'] != 'reported_retrieval':
              raise SystemExit('Synthetic report cannot enter real source artifact')
          print('PASS local immutable bytes and 20 stable-ID source attempts; NOT upstream-authenticated or published')
          PY
      - name: Retain unpublished dated comparison and exact raw evidence (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: m1-stable-id-followup-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/m1-identity-followup/
          if-no-files-found: error
          retention-days: 7

  pageviews:
    name: Derive complete 30-title histories and local atlas (UNPUBLISHED)
    needs: acquire
    if: ${{ needs.acquire.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source without persistent credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.13 standard-library source tools
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Download the same-run exact-SHA current-ID raw evidence
        uses: actions/download-artifact@v4
        with:
          name: m1-real-identity-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts
      - name: Replay both source bundles and create title-scoped pageview seed
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python -m unittest discover -s tests -p 'test_m1_30_history_workflow.py' -v
          python - <<'PY'
          from collections import Counter
          from hashlib import sha256
          import json
          import os
          from pathlib import Path
          from tools.m1_title_discovery import verify as verify_discovery
          from tools.m1_bundle_verify import verify_bundle
          from tools.m1_pageview_handoff import canonical, from_bundle
          from tools.rolling_pageview_source import check_seed
          from datetime import datetime, timezone

          root = Path('artifacts')
          curated = Path('examples/m1_curated_expanded_30_enru.json')
          discovery = verify_discovery(curated, root / 'm1-title')
          proof = verify_bundle(root / 'm1-identity')
          receipt = json.loads((root / 'm1-run-receipt.json').read_bytes())
          panel = json.loads((root / 'm1-identity/panel.json').read_bytes())
          seed, handoff = from_bundle(root / 'm1-identity')
          source_sha = os.environ['SOURCE_SHA']
          if (receipt['schema_version'] != 'dayflare.m1-runtime-evidence.v1'
              or receipt['source_commit'] != source_sha
              or receipt['status'] != 'UNPUBLISHED_REVIEW_REQUIRED'
              or receipt['selected_titles'] != 30
              or receipt['current_id_candidates'] != 30
              or receipt['independently_retained_identities'] != 30
              or receipt['title_exclusions'] != 0
              or receipt['independent_requery_unavailable'] != 0
              or discovery['requested_count'] != 30
              or discovery['candidate_count'] != 30
              or proof['verified_pages'] != 30
              or len(panel['pages']) != 30
              or len(seed['pages']) != 30
              or handoff['candidate_count'] != 30
              or handoff['excluded_count'] != 0):
              raise SystemExit('Incomplete or non-matching current-ID evidence; no pageview request')
          if (sha256((root/'m1-title/discovery-report.json').read_bytes()).hexdigest()
                != receipt['discovery_receipt_sha256']
              or sha256((root/'m1-identity/bundle-manifest.json').read_bytes()).hexdigest()
                != receipt['identity_manifest_sha256']
              or proof['manifest_sha256'] != receipt['identity_manifest_sha256']):
              raise SystemExit('Same-run identity source checksums disagree')
          coverage = Counter((r['project'], r['subject']) for r in seed['pages'])
          if coverage != Counter({(edition, subject): 3 for edition in
                                  ('en.wikipedia', 'ru.wikipedia') for subject in
                                  ('culture', 'books', 'games', 'science', 'sport')}):
              raise SystemExit('30-title edition/subject source coverage changed')
          if handoff['metric_scope'] != 'title_scoped_views_not_stable_page_id_history':
              raise SystemExit('Historical page-ID continuity accidentally implied')
          check_seed(seed, now=datetime.now(timezone.utc))
          (root/'m1-30-pageview-seed.json').write_bytes(canonical(seed))
          (root/'m1-30-pageview-handoff.json').write_bytes(canonical(handoff))
          print('30/30 same-run verified current metadata; Analytics remains title-scoped')
          PY
      - name: Acquire exactly 30 complete 35-day title histories or fail closed
        run: |
          python -m tools.rolling_pageview_source collect artifacts/m1-30-pageview-seed.json artifacts/m1-30-source
          python -m tools.rolling_pageview_source verify artifacts/m1-30-source
      - name: Stage and build two identical offline atlas previews
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m tools.rolling_pageview_source stage artifacts/m1-30-source artifacts/m1-30-stage
          python -m tools.rolling_snapshot_preview --from-stage artifacts/m1-30-stage artifacts/m1-30-preview
          python -m tools.rolling_snapshot_preview --from-stage artifacts/m1-30-stage artifacts/m1-30-preview-repeat
          python - <<'PY'
          from hashlib import sha256
          from html.parser import HTMLParser
          import json
          import os
          from pathlib import Path
          from shutil import rmtree

          class Atlas(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.cards = 0
                  self.details = set()
                  self.links = set()
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'div' and 'card' in a.get('class', '').split():
                      self.cards += 1
                  if tag == 'article' and a.get('id', '').startswith('detail-'):
                      self.details.add(a['id'])
                  if tag == 'a' and a.get('href', '').startswith('#detail-'):
                      self.links.add(a['href'][1:])

          root = Path('artifacts')
          source = root/'m1-30-source'
          preview = root/'m1-30-preview'
          again = root/'m1-30-preview-repeat'
          receipt = json.loads((source/'source-receipt.json').read_bytes())
          candidate_bytes = (source/'candidate.json').read_bytes()
          candidate = json.loads(candidate_bytes)
          manifest = json.loads((preview/'preview-manifest.json').read_bytes())
          stage = json.loads((root/'m1-30-stage/current.json').read_bytes())
          html = (preview/'index.html').read_bytes()
          if (len(candidate['series']) != 30
              or sum(len(s['daily']) for s in candidate['series']) != 1050
              or receipt['requests_attempted'] != 30
              or len(receipt['sources']) != 30
              or manifest['series'] != 30
              or receipt['candidate_sha256'] != sha256(candidate_bytes).hexdigest()
              or stage['version_sha256'] != receipt['candidate_sha256']
              or manifest['candidate_sha256'] != receipt['candidate_sha256']
              or manifest['html_sha256'] != sha256(html).hexdigest()
              or manifest['publication_status'] != 'LOCAL_PREVIEW_NOT_PUBLISHED'
              or stage['publication_status'] != 'LOCAL_CANDIDATE_ONLY_NOT_PUBLISHED'
              or receipt['provenance_status'] != 'runtime_reported_transport_not_independently_authenticated'):
              raise SystemExit('30-title stage, dates, source or preview proof mismatched')
          for filename in ('index.html', 'preview-manifest.json'):
              if (preview/filename).read_bytes() != (again/filename).read_bytes():
                  raise SystemExit('Non-deterministic 30-title visitor build')
          atlas = Atlas()
          atlas.feed(html.decode('utf-8'))
          if atlas.cards != 30 or len(atlas.details) != 30 or atlas.links != atlas.details:
              raise SystemExit('Incomplete 30-topic discover/detail visitor paths')
          if b'LOCAL EVIDENCE' not in html or b'not</strong> a public release' not in html:
              raise SystemExit('Visitor source and publication warning disappeared')
          (root/'index.html').write_bytes(html)
          (root/'START_HERE.txt').write_text(
              'Dayflare / 30 selected EN/RU title histories. LOCAL ONLY, NOT PUBLISHED.\n'
              'Extract ZIP and open index.html; see m1-30-preview/preview-manifest.json.\n'
              'Historical title-scoped daily requests, NOT stable page-ID continuity.\n'
              'Source identities and raw receipts: m1-title/ and m1-identity/.\n'
              'Pageview source responses and exact count: m1-30-source/.\n',
              encoding='utf-8')
          (root/'m1-30-pageview-run.json').write_text(json.dumps({
              'schema_version': 'dayflare.m1-30-local-pageviews.v1',
              'source_commit': os.environ['SOURCE_SHA'],
              'identity_manifest_sha256': json.loads(
                  (root/'m1-run-receipt.json').read_bytes())['identity_manifest_sha256'],
              'candidate_sha256': receipt['candidate_sha256'],
              'html_sha256': manifest['html_sha256'],
              'selected_titles': 30, 'daily_observations': 1050,
              'observation_end_utc': candidate['observation_end'],
              'retrieved_at': candidate['retrieved_at'],
              'status': 'UNPUBLISHED_SOURCE_REVIEW_REQUIRED',
              'scope': 'title-based Wikimedia Analytics requests, not historical page identity'
          }, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8')
          rmtree(again)
          print('UNPUBLISHED 30-title visitor atlas: exact 1050 daily observations, deterministic HTML')
          PY
      - name: Retain all raw provenance, stage and local HTML (7 days only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m1-30-local-pageviews-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/m1-title/
            artifacts/m1-identity/
            artifacts/m1-run-receipt.json
            artifacts/m1-30-pageview-seed.json
            artifacts/m1-30-pageview-handoff.json
            artifacts/m1-30-source/
            artifacts/m1-30-stage/current.json
            artifacts/m1-30-stage/versions/
            artifacts/m1-30-preview/
            artifacts/m1-30-pageview-run.json
            artifacts/START_HERE.txt
            artifacts/index.html
          if-no-files-found: error
          retention-days: 30
