# Rebuild the dated #347 source retained in Git by #350; never refresh observations.
# Read-only CI acceptance; no acquisition, deployment or release.
name: M1 niche archived visitor acceptance
on:
  pull_request:
    paths:
      - .github/workflows/m1-niche-visitor-replay.yml
permissions:
  contents: read
jobs:
  visitor:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Rebuild the pinned 19-title source twice and verify CSV parity
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m tools.m1_niche_replay replay artifacts/niche-visitor
          python -m tools.m1_niche_replay replay artifacts/niche-repeat
          cmp artifacts/niche-visitor/index.html artifacts/niche-repeat/index.html
          cmp artifacts/niche-visitor/preview-manifest.json artifacts/niche-repeat/preview-manifest.json
          python -m tools.m1_niche_signal_csv artifacts/niche-signals.csv
          cmp artifacts/niche-signals.csv downloads/dayflare-19-2026-11-23-weekly-signals.csv
          printf '%s  %s\n' 7099eeb63b7db35411f349a332b852f1371b8d1b44f6f6e164fed903dea8a79d artifacts/niche-signals.csv | sha256sum --check
          printf '%s  %s\n' b7b44b1757933a9b2d788fcddd63980cb64cfcd31f1996c8eb08eded0daf6d64 downloads/dayflare-19-2026-11-23.html | sha256sum --check
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("artifacts/niche-visitor")
          manifest = json.loads((root / "preview-manifest.json").read_bytes())
          html = (root / "index.html").read_bytes()
          assert 0 < len(html) <= 2_000_000
          assert hashlib.sha256(html).hexdigest() == manifest["html_sha256"]
          assert manifest["candidate_sha256"] == "10f78c6ab626a6ff2845b4db3e2e207144389ed387f88e22d31f4eeeeaaa905e"
          assert manifest["series"] == 19 and manifest["observation_end"] == "2026-11-23"
          assert manifest["retrieved_at"] == "2026-11-26T05:24:57Z"
          assert manifest["publication_status"] == "LOCAL_PREVIEW_NOT_PUBLISHED"
          PY
      - name: Install pinned Playwright Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check native HTTP and offline file visitor journeys
        run: |
          python - <<'PY'
          import csv
          from fractions import Fraction
          from functools import partial
          from hashlib import sha256
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          import json
          from pathlib import Path
          from threading import Thread
          from urllib.parse import urlsplit, parse_qs
          from playwright.sync_api import sync_playwright, expect

          root = Path("artifacts/niche-visitor").resolve()
          source = root / "index.html"
          pin = sha256(source.read_bytes()).hexdigest()
          left, right = "detail-en-wikipedia-21489", "detail-en-wikipedia-703297"
          weeks = [[1393, 1411, 1228, 1586, 1344], [983, 878, 797, 793, 739]]
          receipts = []
          summary_receipts = []
          with Path("artifacts/niche-signals.csv").open(encoding="utf-8", newline="") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 19
          signals = {}
          for row in rows:
              key = "detail-" + row["project_page_id"].replace(".", "-").replace(":", "-")
              assert key not in signals
              delta = Fraction(row["median_delta"])
              step = int(row["adjacent_week_step"])
              opposite = delta * step < 0
              assert row["opposite_nonzero_signs"] == str(int(opposite))
              signals[key] = (row, delta, step)
          matches = {key for key, (_, delta, step) in signals.items() if delta * step < 0}
          assert {signals[key][0]["title"] for key in matches} == {
              "Zoetrope", "Foucault pendulum", "Цианотипия", "Плутовской роман"}
          assert len(matches) == 4

          def summary(page, mode, width, state, expected_keys, counts):
              status = page.locator("#atlas-results")
              expect(status).to_have_attribute("role", "status")
              expect(status).to_have_attribute("aria-live", "polite")
              gains, drops, flat, opposite = counts
              expect(status).to_contain_text(
                  f"Latest vs prior UTC week: gains {gains}, drops {drops}, unchanged {flat}; "
                  f"opposite nonzero signs {opposite}.")
              cards = page.locator(".card:not([hidden])")
              rows = page.locator("#compare-table tbody tr:not([hidden])")
              assert sum(counts[:3]) == len(expected_keys)
              assert set(cards.evaluate_all("els => els.map(e => e.dataset.series)")) == expected_keys
              assert set(rows.evaluate_all("els => els.map(e => e.dataset.series)")) == expected_keys
              expect(page.locator("#atlas-empty")).to_be_hidden() if expected_keys else expect(
                  page.locator("#atlas-empty")).to_be_visible()
              geometry(page)
              if width not in (320, 390):
                  return
              # Capture the actual status and surrounding context, not the page hero.
              status.evaluate("e => {e.scrollIntoView({block:'start',behavior:'instant'}); scrollBy(0,-72)}")
              info = status.evaluate("""e => {
                  const box=e.getBoundingClientRect(), range=document.createRange();
                  range.selectNodeContents(e);
                  const rects=[...range.getClientRects()];
                  const after=document.querySelector(e.nextElementSibling.hidden ?
                      '.atlas-jumps' : '#atlas-empty').getBoundingClientRect();
                  const card=document.querySelector('.card:not([hidden])');
                  const first=card ? card.getBoundingClientRect() : null;
                  const style=getComputedStyle(e);
                  return {top:box.top,bottom:box.bottom,left:box.left,right:box.right,
                      width:innerWidth,height:innerHeight,lines:rects.length,
                      fontSize:parseFloat(style.fontSize),lineHeight:style.lineHeight,
                      textFits:rects.every(r=>r.left>=box.left-1 && r.right<=box.right+1 &&
                          r.top>=box.top-1 && r.bottom<=box.bottom+1),
                      noClip:e.scrollWidth<=e.clientWidth && e.scrollHeight<=e.clientHeight,
                      noOverlap:after.top>=box.bottom-1,
                      firstVisible:first ? first.top<innerHeight && first.bottom>box.bottom : null};
              }""")
              assert info["top"] >= 0 and info["bottom"] <= info["height"], info
              assert info["left"] >= 0 and info["right"] <= info["width"], info
              assert info["lines"] > 0 and info["fontSize"] >= 14, info
              assert info["textFits"] and info["noClip"] and info["noOverlap"], info
              assert info["firstVisible"] if expected_keys else info["firstVisible"] is None, info
              name = f"{mode}-{width}-summary-{state}"
              screenshot(page, name)
              summary_receipts.append({"state": state, "mode": mode, "counts": counts,
                  "keys": sorted(expected_keys), "geometry": info, **receipts[-1]})

          def opposite_filter(page, mode, width):
              cards = page.locator(".card")
              actual = {card["series"]: (card["title"], int(card["delta2"]), int(card["weekStep"]))
                        for card in cards.evaluate_all("els => els.map(e => ({...e.dataset}))")}
              assert actual == {key: (row["title"], int(delta * 2), step)
                                for key, (row, delta, step) in signals.items()}
              selector = page.locator("#atlas-step-direction")
              selector.select_option("opposite")
              def check_visible():
                  visible = page.locator(".card:not([hidden])")
                  expect(visible).to_have_count(4)
                  assert set(visible.evaluate_all("els => els.map(e => e.dataset.series)")) == matches
                  comparison = page.locator("#compare-table tbody tr:not([hidden])")
                  expect(comparison).to_have_count(4)
                  assert set(comparison.evaluate_all("els => els.map(e => e.dataset.series)")) == matches
                  geometry(page)
              check_visible()
              summary(page, mode, width, "opposite", matches, [3, 1, 0, 4])
              page.locator("#atlas-filters").scroll_into_view_if_needed()
              screenshot(page, f"{mode}-{width}-opposite")
              with page.expect_download() as event:
                  page.locator("#compare-week-changes-csv").click()
              with Path(event.value.path()).open(encoding="utf-8-sig", newline="") as f:
                  exported = list(csv.DictReader(f))
              assert len(exported) == 20
              assert {row["snapshot_series_key"] for row in exported} == matches
              for key in matches:
                  history = [row for row in exported if row["snapshot_series_key"] == key]
                  expected = [int(signals[key][0][f"week{i}"]) for i in range(1, 6)]
                  assert [int(row["weekly_requests"]) for row in history] == expected
                  assert history[0]["change_from_prior_week_requests"] == ""
                  assert [int(row["change_from_prior_week_requests"]) for row in history[1:]] == [
                      b - a for a, b in zip(expected, expected[1:])]
                  assert all(row["dataset_sha256"] ==
                      "10f78c6ab626a6ff2845b4db3e2e207144389ed387f88e22d31f4eeeeaaa905e"
                      for row in history)
              shared = page.locator("#atlas-filter-link").get_attribute("href")
              assert parse_qs(urlsplit(shared).query)["af_step"] == ["opposite"]
              page.goto(shared, wait_until="domcontentloaded")
              expect(selector).to_have_value("opposite")
              check_visible()
              page.locator("#atlas-change").select_option("positive")
              expect(page.locator(".card:not([hidden])")).to_have_count(1)
              assert page.locator(".card:not([hidden])").get_attribute("data-title") == "Foucault pendulum"
              page.locator("#atlas-filters button[type=reset]").click()
              expect(page.locator(".card:not([hidden])")).to_have_count(19)
              page.goto(shared.replace("af_change=all", "af_change=opposite"), wait_until="domcontentloaded")
              expect(page.locator("#atlas-filter-warning")).to_be_visible()
              expect(selector).to_have_value("all")
              page.goto(shared.replace("10f78c6ab626a6ff2845b4db3e2e207144389ed387f88e22d31f4eeeeaaa905e",
                                      "0" * 64), wait_until="domcontentloaded")
              expect(page.locator("#atlas-filter-warning")).to_be_visible()
              expect(selector).to_have_value("all")
              expect(page.locator(".card:not([hidden])")).to_have_count(19)

          def pair(page):
              expect(page.locator("#pair-output")).to_be_visible()
              rows = page.locator("#pair-table tbody tr")
              expect(rows).to_have_count(2)
              assert [rows.nth(i).get_attribute("data-series") for i in range(2)] == [left, right]
              assert [[int(v.replace(",", "")) for v in rows.nth(i).locator("td").all_inner_texts()[:5]]
                      for i in range(2)] == weeks
              expect(page.locator("#pair-changes-table tbody tr")).to_have_count(5)
              expect(page.locator("#pair-daily-charts svg")).to_have_count(2)
              expect(page.locator("#pair-status")).to_contain_text("does not establish cross-edition entity equivalence")

          def geometry(page):
              assert page.evaluate("document.documentElement.scrollWidth <= innerWidth")
              assert page.evaluate("[...document.querySelectorAll('.card h3, article h3')].every(e => e.scrollWidth <= e.clientWidth)")

          def screenshot(page, name):
              path = root / (name + ".png")
              page.screenshot(path=str(path))
              receipts.append({"screenshot": path.name, "sha256": sha256(path.read_bytes()).hexdigest()})

          server = ThreadingHTTPServer(("127.0.0.1", 0),
              partial(SimpleHTTPRequestHandler, directory=str(root)))
          worker = Thread(target=server.serve_forever, daemon=True)
          worker.start()
          http = f"http://127.0.0.1:{server.server_port}/index.html"
          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  try:
                      for width in (320, 390, 1280):
                          for mode, url in (("http", http), ("file", source.as_uri())):
                              context = browser.new_context(viewport={"width": width, "height": {320: 700, 390: 844, 1280: 820}[width]},
                                  reduced_motion="reduce", offline=(mode == "file"))
                              page = context.new_page()
                              errors, external = [], []
                              page.on("pageerror", lambda e: errors.append(str(e)))
                              page.on("request", lambda req: external.append(req.url)
                                      if not req.url.startswith(url.split("index.html")[0]) else None)
                              page.goto(url, wait_until="domcontentloaded", timeout=30000)
                              expect(page.locator(".card")).to_have_count(19)
                              expect(page.locator("article .scroll tbody tr")).to_have_count(665)
                              expect(page.locator(".warning")).to_contain_text("LOCAL EVIDENCE")
                              expect(page.locator("#pair-form")).to_be_visible()
                              geometry(page)
                              screenshot(page, f"{mode}-{width}-overview")
                              page.keyboard.press("Tab")
                              expect(page.locator("a.skip")).to_be_focused()
                              page.keyboard.press("Enter")
                              expect(page).to_have_url(url + "#main")
                              summary(page, mode, width, "all", set(signals), [6, 12, 1, 4])
                              page.locator("#atlas-query").fill("nonexistent-dayflare-test-123")
                              expect(page.locator("#atlas-empty")).to_be_visible()
                              summary(page, mode, width, "empty", set(), [0, 0, 0, 0])
                              page.locator("#atlas-filters button[type=reset]").click()
                              expect(page.locator("#atlas-empty")).to_be_hidden()
                              opposite_filter(page, mode, width)
                              page.locator("#pair-left").select_option(left)
                              page.locator("#pair-right").select_option(right)
                              pair(page)
                              geometry(page)
                              page.locator("#pair-output").scroll_into_view_if_needed()
                              screenshot(page, f"{mode}-{width}-pair")
                              shared = page.locator("#pair-share").get_attribute("href")
                              parsed = urlsplit(shared)
                              params = parse_qs(parsed.query)
                              assert parsed.scheme == mode and parsed.fragment == "pair-compare"
                              assert params["af_left"] == [left] and params["af_right"] == [right]
                              assert params["af_dataset"] == ["10f78c6ab626a6ff2845b4db3e2e207144389ed387f88e22d31f4eeeeaaa905e"]
                              page.goto(shared, wait_until="domcontentloaded")
                              pair(page)
                              page.locator("#pair-right").select_option(left)
                              expect(page.locator("#pair-output")).to_be_hidden()
                              expect(page.locator("#pair-share")).to_be_hidden()
                              page.goto(shared.replace(params["af_dataset"][0], "0" * 64),
                                        wait_until="domcontentloaded")
                              expect(page.locator("#pair-output")).to_be_hidden()
                              expect(page.locator("#pair-share")).to_be_hidden()
                              assert not errors and not external, (errors, external)
                              context.close()
                              print(f"PASS {mode} {width}px: pair counts, restore, keyboard, empty and invalid states")
                      context = browser.new_context(viewport={"width": 320, "height": 820},
                          java_script_enabled=False, offline=True)
                      page = context.new_page()
                      page.goto(source.as_uri(), wait_until="domcontentloaded")
                      expect(page.locator("article .scroll tbody tr")).to_have_count(665)
                      expect(page.locator("#compare-table tbody tr")).to_have_count(19)
                      geometry(page)
                      screenshot(page, "file-320-nojs")
                      context.close()
                  finally:
                      browser.close()
          finally:
              server.shutdown()
              server.server_close()
              worker.join(timeout=5)
          assert sha256(source.read_bytes()).hexdigest() == pin
          assert len(summary_receipts) == 12
          (root / "receipt.json").write_text(json.dumps({
              "html_sha256": pin, "source_artifact": 15090355289,
              "source_zip_sha256": "122d1d43246d8d34afcef6b2721cc5aeb805c19458d0a4ef86f898bf6aaf5a45",
              "opposite_matches": sorted(matches), "filtered_export_rows": 20,
              "reproducible_builds": 2, "historical_html_sha256": "b7b44b1757933a9b2d788fcddd63980cb64cfcd31f1996c8eb08eded0daf6d64",
              "status": "LOCAL_HTTP_AND_FILE_NOT_PUBLISHED", "screenshots": receipts,
              "summary_checks": summary_receipts,
              "pair": [left, right], "weekly_counts": weeks,
          }, sort_keys=True) + "\n")
          PY
      - name: Retain exact HTML and browser receipts (not published)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m1-niche-visitor-replay-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: artifacts/niche-visitor/
          if-no-files-found: error
          retention-days: 30
