name: M1 bounded culture and games historical views

on:
  pull_request:
    paths:
      - .github/workflows/m1-cross-subject-views.yml
      - tools/m1_cross_subject_views.py
      - tests/test_m1_cross_subject_views.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-cross-subject-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise offline synthetic and failure controls
        run: python -m unittest tests.test_m1_cross_subject_views -v
      - name: Acquire four bounded real title histories
        run: python -m tools.m1_cross_subject_views
      - name: Retain unpublished evidence and failure receipts for independent acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-cross-subject-views-${{ github.sha }}
          path: artifacts/m1_cross_subject_views/
          if-no-files-found: error
          retention-days: 7
