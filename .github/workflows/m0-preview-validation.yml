# Read-only M0 candidate acceptance. Actual Pages publishing is a separate gate.
name: M0 offline and browser acceptance
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    name: M0 Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test-only HTML and CSS parsers
        run: python -m pip install -r requirements-test.txt
      - name: Verify exact checkout and reproducible release
        run: python -m tools.run_m0_ci --python-only
  browser:
    name: M0 Chromium shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned Playwright Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Bounded M0 browser and publication-contract shard
        run: python -m tools.run_m0_ci --browser-shard ${{ matrix.shard }}
