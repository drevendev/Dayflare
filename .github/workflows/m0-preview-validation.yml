# Read-only M0 candidate acceptance. Actual Pages publishing is a separate gate.
name: M0 offline and browser acceptance
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    name: M0 Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test-only HTML and CSS parsers
        run: python -m pip install -r requirements-test.txt
      - name: Verify exact checkout and reproducible release
        run: python -m tools.run_m0_ci --python-only
  browser:
    name: M0 Chromium shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned Playwright Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Bounded M0 browser and publication-contract shard
        run: python -m tools.run_m0_ci --browser-shard ${{ matrix.shard }}

  native_http:
    name: M0 native HTTP Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test real local HTTP browser experience
        run: timeout --signal=TERM --kill-after=10s 240s python tests/browser_m0_http.py
      - name: Retain exact-head screenshots and receipt for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-http-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/m0-http/
          if-no-files-found: ignore
          retention-days: 7

  candidate:
    name: M0 accepted-master candidate (unpublished)
    # Never upload a release candidate from unmerged/untrusted PR code.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [python, browser, native_http]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout accepted master commit without retained credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build and check exact-commit deterministic candidate receipt
        env:
          DAYFLARE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python -m tools.m0_release_receipt \
            --expected-commit "$DAYFLARE_SOURCE_COMMIT" \
            --output artifacts/m0-unpublished
      - name: Retain candidate ZIP, manifest and unapproved receipt
        uses: actions/upload-artifact@v4
        with:
          name: m0-unpublished-${{ github.sha }}
          path: artifacts/m0-unpublished/
          if-no-files-found: error
          retention-days: 7
