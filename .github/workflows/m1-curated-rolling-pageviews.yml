# Bounded read-only M1 source evidence: PR, manual, daily UTC on accepted master.
# Each run independently validates a local artifact; no branch/Pages writes or public freshness claim.
name: M1 20 observed EN/RU identities — title-scoped pageview evidence
on:
  pull_request:
    paths:
      - .github/workflows/m1-curated-rolling-pageviews.yml
      - site/identities-m1-20261024.json
      - tools/rolling_pageview_source.py
      - tools/stage_rolling_version.py
      - tools/rolling_snapshot_preview.py
      - tools/m1_dataset_share.js
      - tests/test_rolling_snapshot_preview.py
      - tests/test_m1_dataset_share.py
      - tests/js_m1_dataset_share.cjs
      - tools/m1_publication_gate.py
      - tests/test_m1_publication_gate.py
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'  # GitHub runs schedules on default branch in UTC.
permissions:
  contents: read
concurrency:
  group: m1-20-title-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Offline transport and atomic-stage regressions
        run: |
          python -m unittest discover -s tests -p 'test_rolling_pageview_source.py' -v
          python -m unittest discover -s tests -p 'test_stage_rolling_version.py' -v
          python -m unittest discover -s tests -p 'test_m1_dataset_share.py' -v
          node tests/js_m1_dataset_share.cjs
      - name: Pin accepted 20-ID observed metadata into title-query seed
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from collections import Counter
          from datetime import datetime, timezone
          from hashlib import sha256
          import json
          from pathlib import Path
          from tools.rolling_pageview_source import check_seed
          panel_bytes = Path('site/identities-m1-20261024.json').read_bytes()
          if sha256(panel_bytes).hexdigest() != '38974e9b35b057c0008ffb6d583291da13c9624c2339fb95bb60f86720a69151':
              raise SystemExit('Observed panel checksum changed; review new selection before collecting')
          panel = json.loads(panel_bytes)
          if (panel['schema_version'] != 'dayflare.m1.observed-identity-panel.v1' or
              panel['dataset_id'] != 'm1-20261024-enru-curated-20' or
              panel['status'] != 'RETAINED_METADATA_ONLY_UNPUBLISHED' or
              panel['selection'] != 'editorial_curated_not_representative' or
              panel['pageviews'] != 'NOT_COLLECTED_FOR_THIS_PANEL' or
              panel['cross_edition_mapping'] != 'AMBIGUOUS_NOT_RESOLVED' or
              panel['intended_count'] != 20 or panel['obtained_count'] != 20 or
              len(panel['pages']) != 20):
              raise SystemExit('Observed source scope/status/coverage changed')
          fields = ('project', 'page_id', 'title', 'subject')
          pages = [{key: row[key] for key in fields} for row in panel['pages']]
          coverage = Counter((p['project'], p['subject']) for p in pages)
          if any(coverage[(edition, subject)] != 2 for edition in ('en.wikipedia', 'ru.wikipedia')
                 for subject in ('culture', 'books', 'games', 'science', 'sport')):
              raise SystemExit('Expected 2 observed IDs per edition and subject')
          seed = {'schema_version': 'dayflare.rolling-pageview-seeds.v1',
                  'selected_at': panel['observation_date_utc'],
                  'method_version': 'v0-empirical-35d', 'provider_lag_days': 2,
                  'pages': sorted(pages, key=lambda p: (p['project'], p['page_id']))}
          validated = check_seed(seed, now=datetime.now(timezone.utc))
          if len(validated) != 20:
              raise SystemExit('The rolling seed gate rejected part of the intended panel')
          destination = Path('artifacts/m1-curated-seed.json')
          with destination.open('xb') as f:
              f.write((json.dumps(seed, ensure_ascii=False, sort_keys=True,
                                  separators=(',', ':'), allow_nan=False) + '\n').encode())
          print('20 pinned editorial identities; title-scoped historical queries ONLY; no ID continuity asserted')
          PY
      - name: Collect 20 complete 35-day title histories or fail closed
        run: |
          python -m tools.rolling_pageview_source collect artifacts/m1-curated-seed.json artifacts/m1-curated-source
          python -m tools.rolling_pageview_source verify artifacts/m1-curated-source
      - name: Source-verify then stage immutable LOCAL candidate only
        run: |
          python -m tools.rolling_pageview_source stage artifacts/m1-curated-source artifacts/m1-curated-stage
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          root = Path('artifacts/m1-curated-source')
          receipt = json.loads((root/'source-receipt.json').read_text())
          candidate_bytes = (root/'candidate.json').read_bytes()
          candidate = json.loads(candidate_bytes)
          pointer = json.loads(Path('artifacts/m1-curated-stage/current.json').read_text())
          checksum = sha256(candidate_bytes).hexdigest()
          if (receipt['requests_attempted'] != 20 or len(receipt['sources']) != 20 or
              len(candidate['series']) != 20 or
              sum(len(x['daily']) for x in candidate['series']) != 700 or
              checksum != receipt['candidate_sha256'] or
              checksum != pointer['version_sha256'] or
              pointer['publication_status'] != 'LOCAL_CANDIDATE_ONLY_NOT_PUBLISHED'):
              raise SystemExit('Candidate, retained-body receipt or staging pointer mismatch')
          print('RETAINED_UNPUBLISHED: 20 source receipts, 700 observations; no historical ID continuity proof')
          PY
      - name: Export and reproduce the source-verified 20-title visitor atlas (local-only)
        run: |
          set -euo pipefail
          python -m tools.rolling_snapshot_preview --from-stage artifacts/m1-curated-stage artifacts/m1-curated-preview
          python -m tools.rolling_snapshot_preview --from-stage artifacts/m1-curated-stage artifacts/m1-curated-preview-repeat
          python - <<'PY'
          from hashlib import sha256
          from html.parser import HTMLParser
          import json
          from pathlib import Path
          from shutil import rmtree

          class VisitorStructure(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.cards = 0
                  self.charts = []
                  self.details = set()
                  self.links = set()

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'div' and 'card' in attrs.get('class', '').split():
                      self.cards += 1
                  if tag == 'div' and 'week-bars' in attrs.get('class', '').split():
                      self.charts.append(attrs.get('aria-label', ''))
                  if tag == 'article' and attrs.get('id', '').startswith('detail-'):
                      self.details.add(attrs['id'])
                  if tag == 'a' and attrs.get('href', '').startswith('#detail-'):
                      self.links.add(attrs['href'][1:])

          root = Path('artifacts')
          preview = root / 'm1-curated-preview'
          repeat = root / 'm1-curated-preview-repeat'
          if {p.name for p in preview.iterdir()} != {'index.html', 'preview-manifest.json'}:
              raise SystemExit('Unexpected preview inventory')
          if {p.name for p in repeat.iterdir()} != {'index.html', 'preview-manifest.json'}:
              raise SystemExit('Unexpected repeat-preview inventory')
          for name in ('index.html', 'preview-manifest.json'):
              if (preview / name).read_bytes() != (repeat / name).read_bytes():
                  raise SystemExit('Non-deterministic stage-derived atlas: ' + name)

          html = (preview / 'index.html').read_bytes()
          manifest = json.loads((preview / 'preview-manifest.json').read_bytes())
          pointer = json.loads((root / 'm1-curated-stage/current.json').read_bytes())
          receipt = json.loads((root / 'm1-curated-source/source-receipt.json').read_bytes())
          candidate = json.loads((root / 'm1-curated-source/candidate.json').read_bytes())
          digest = sha256((root / 'm1-curated-source/candidate.json').read_bytes()).hexdigest()
          if (manifest['candidate_sha256'] != digest or pointer['version_sha256'] != digest or
              receipt['candidate_sha256'] != digest or
              manifest['html_sha256'] != sha256(html).hexdigest() or
              manifest['dataset_id'] != candidate['dataset_id'] or
              manifest['observation_end'] != candidate['observation_end'] or
              manifest['retrieved_at'] != candidate['retrieved_at']):
              raise SystemExit('Atlas manifest does not bind exact accepted source/HTML bytes')
          if (manifest['publication_status'] != 'LOCAL_PREVIEW_NOT_PUBLISHED' or
              pointer['publication_status'] != 'LOCAL_CANDIDATE_ONLY_NOT_PUBLISHED' or
              receipt['provenance_status'] != 'runtime_reported_transport_not_independently_authenticated' or
              manifest['provenance_status'] != receipt['provenance_status']):
              raise SystemExit('Atlas lost its explicit non-public, non-attested status')
          if (manifest['series'] != 20 or len(candidate['series']) != 20 or
              sum(len(row['daily']) for row in candidate['series']) != 700):
              raise SystemExit('Unexpected 20-title/700-observation coverage')
          visitor = VisitorStructure()
          visitor.feed(html.decode('utf-8'))
          if (visitor.cards != 20 or len(visitor.details) != 20 or
              len(visitor.charts) != 20 or
              any(not label.startswith('Weekly requests, oldest to newest: week 1 ')
                  or label.count('week ') != 5 for label in visitor.charts) or
              visitor.links != visitor.details):
              raise SystemExit('Missing discover-to-detail paths in the generated visitor atlas')
          if (b'LOCAL EVIDENCE' not in html or b'not</strong> a public release' not in html):
              raise SystemExit('Visitor-facing provenance/publication warning missing')
          # Upload-artifact strips the common artifacts/ prefix from ZIP paths.
          # Give visitors an obvious offline entrypoint; preserve the verified
          # preview bytes rather than rendering a second independent projection.
          entrypoint = root / 'index.html'
          with entrypoint.open('xb') as output:
              output.write(html)
          if sha256(entrypoint.read_bytes()).hexdigest() != manifest['html_sha256']:
              raise SystemExit('Archive root entrypoint differs from verified preview HTML')
          guide = (
              'Dayflare | LOCAL Wikimedia evidence atlas — NOT PUBLISHED\n'
              'Extract the whole ZIP and open index.html in a browser.\n'
              'Equivalent copy: m1-curated-preview/index.html\n'
              'Read preview-manifest.json in m1-curated-preview/ for exact checksums.\n'
              f'Dataset: {manifest["dataset_id"]}\n'
              f'Observation window ends (UTC): {manifest["observation_end"]}\n'
              f'Retrieved at (UTC): {manifest["retrieved_at"]}\n'
              f'Candidate SHA-256: {manifest["candidate_sha256"]}\n'
              'Source bodies and receipts: m1-curated-source/\n'
              'Immutable accepted local stage: m1-curated-stage/\n'
              '20 editorial EN/RU title histories, 700 daily request counts.\n'
              'This ZIP is not live, public Pages, a popularity ranking, or proof\n'
              'of historical page-ID continuity or cross-edition equivalence.\n'
          )
          (root / 'START_HERE.txt').write_text(guide, encoding='utf-8')
          rmtree(repeat)
          print('UNPUBLISHED verified local atlas: 20 discovery cards, 20 details, 700 exact days, two identical builds and a ZIP-root entrypoint.')
          PY
      - name: Replay real source and stage dated static candidate (NO DEPLOYMENT)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_m1_publication_gate.py' -v
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("artifacts")
          archive = Path(os.environ["RUNNER_TEMP"]) / "m1-evidence.zip"
          # Mirror the reviewed success-only artifact paths. The local stage
          # creates an advisory .lock file which is not part of source evidence.
          included = ("m1-curated-seed.json", "m1-curated-source",
                      "m1-curated-stage/current.json", "m1-curated-stage/versions",
                      "m1-curated-preview", "index.html", "START_HERE.txt")
          selected = []
          for member in included:
              path = root / member
              if path.is_symlink():
                  raise SystemExit("symlink in archive selection")
              if path.is_file():
                  selected.append(path)
              elif path.is_dir():
                  selected.extend(p for p in path.rglob("*") if p.is_file())
              else:
                  raise SystemExit(f"missing archive member: {member}")
          with ZipFile(archive, "w", compression=ZIP_DEFLATED) as output:
              for file in sorted(selected):
                  if file.is_symlink():
                      raise SystemExit("symlink in archive member")
                  output.write(file, file.relative_to(root).as_posix())
          print("Candidate input archive assembled; nothing published")
          PY
          pin="$(python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          print(sha256(Path("artifacts/m1-curated-source/candidate.json").read_bytes()).hexdigest())
          PY
          )"
          python -m tools.m1_publication_gate \
            --archive "$RUNNER_TEMP/m1-evidence.zip" \
            --destination artifacts/m1-release-candidate \
            --expected-candidate-sha256 "$pin"
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          folder = Path("artifacts/m1-release-candidate")
          if {p.name for p in folder.iterdir()} != {"index.html", ".nojekyll", "release-manifest.json"}:
              raise SystemExit("unexpected static candidate inventory")
          manifest = json.loads((folder / "release-manifest.json").read_bytes())
          page = (folder / "index.html").read_bytes()
          if (manifest["html_sha256"] != sha256(page).hexdigest() or
                  manifest["status"] != "DATED_ARCHIVE_NOT_LIVE" or
                  manifest["daily_observations"] != 700 or
                  b"DATED SOURCE EVIDENCE" not in page or
                  b"UPSTREAM ORIGIN NOT INDEPENDENTLY VERIFIED" not in page):
              raise SystemExit("static candidate lacks provenance/data/HTML binding")
          print("STAGED_NOT_DEPLOYED: dated 20-title/700-observation static candidate")
          PY
      - name: Retain exact raw source and local candidate for later acceptance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m1-curated-rolling-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/m1-curated-seed.json
            artifacts/m1-curated-source/
            artifacts/m1-curated-stage/current.json
            artifacts/m1-curated-stage/versions/
            artifacts/m1-curated-preview/
            artifacts/index.html
            artifacts/START_HERE.txt
            artifacts/m1-release-candidate/
          if-no-files-found: error
          include-hidden-files: true  # Publish .nojekyll in the UNPUBLISHED candidate artifact.
          retention-days: 30
